# The maintainer's own keys for the IDE's tmux server. `install --link-dotfiles` links
# <config>/tmux.conf (~/.config/tx-ide/tmux.conf) here; tx sources that file after everything it
# ships, so what is set here wins. tx itself ships tmux's stock keys: these are the prefix, split
# and resize keys it shipped before that.

# === Prefix ===
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# === Pane splits inherit cwd ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# === Pane resize (vim-style, repeatable within repeat-time) ===
# Overrides prefix+l (last-window) — use prefix+n/p or prefix+w instead.
bind -r h resize-pane -L 15
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 15

# === No layout presets on prefix+M-1..7 ===
# (was in keys/ide.tmux) Default tmux: prefix M-1..7 trigger layout cycling — unbind so a stray
# prefix+digit doesn't reflow your panes.
unbind -T prefix M-1
unbind -T prefix M-2
unbind -T prefix M-3
unbind -T prefix M-4
unbind -T prefix M-5
unbind -T prefix M-6
unbind -T prefix M-7
