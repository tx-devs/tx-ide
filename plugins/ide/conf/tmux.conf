# Sourced from `<data>/conf/tmux.conf`, written by `tx update` from the `ide` plugin's
# resource `conf/tmux.conf`.
#
# Layered under keys/ide.tmux (also the `ide` plugin's): this file owns options only — vi
# copy-mode, the status bar (including status-right), mouse, history, clipboard, indexing — and
# keeps every stock tmux key (prefix C-b, splits, layouts). keys/ide.tmux owns the IDE's root-table
# keys (seamless nav, the agent scroll intercept, C-Tab window cycling, M-1..9 / User0..8
# quick-switch). Every other tx key belongs to its own plugin's keys/<id>.tmux; which key runs
# what is the plugins' `keys` settings (`tx config`).
#
# The user's own <config>/tmux.conf is sourced after all of them and wins.

# === General ===
set -g history-limit 50000
set -g mouse on
set -g escape-time 10                  # less input lag in nvim
set -g repeat-time 2000                # window for -r repeats (default 500ms)
set -g focus-events on                 # nvim autoread
set -gq allow-passthrough on           # iTerm imgproto, OSC52
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"    # truecolor

# === Window/pane indexing ===
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === Vi-style copy mode ===
setw -g mode-keys vi
# Two paths to the system clipboard, neither relying on iTerm2's OSC52
# handling (denied by default):
#  - local copy-mode yanks (mouse drag, y, Enter) pipe to pbcopy via
#    copy-command;
#  - OSC52 arriving from panes — a VPS tmux over ssh, codex, nvim — is
#    accepted (set-clipboard on) and funneled to pbcopy by the hook.
# On a host without pbcopy (a Linux VPS) the if-shell block is skipped: copies
# land in a tmux buffer and set-clipboard emits OSC52 to the client, which the
# tmux on the Mac then catches. terminal-features guarantees the Ms capability
# even when the client's terminfo entry lacks it.
set -s set-clipboard on
set -as terminal-features ',*:clipboard'
if-shell 'command -v pbcopy' {
  set -s copy-command 'pbcopy'
  set-hook -g pane-set-clipboard 'run-shell "tmux save-buffer - | pbcopy"'
}
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# === Status bar ===
# Hidden globally. tx-ide flips `status on` per-session for @tx-view-marked view sessions
# (set up by `tx ui attach`, which creates the `home` view). Colours, border grammar, rule/bar
# layout and window formats live in `<data>/conf/theme.tmux` (generated by `tx update` and
# `tx _theme-apply` from `config.yaml`'s `theme:` section).
# status-right: system resources, the clock and the session name. The `#()` command is
# format-expanded before it runs, so `@tx-data` (written by `tx update`) locates the script.
set -g status off
set -g status-interval 1
set -g status-justify left

# The `tx` chip; the `attention` plugin's fragment appends the agents that need you after it.
set -g status-left-length 80
set -g status-left "#[#{@tx-chip-style}] #{@tx-mark} #[default]"
set -g status-right-length 80
set -g status-right " #{E:@tx-swarm}#[#{@tx-muted-style}] #(#{@tx-data}/bin/tmux-system-resources)  %H:%M  #S#[default] "

# No inline notifications in the status bar.
setw -g monitor-bell off
setw -g monitor-activity off
set -g bell-action none
set -g activity-action none

# === Titles pinned to tmux session/window names ===
set -g set-titles on
set -g set-titles-string '#{@tx-mark} · #S'
set -g allow-rename off
setw -g automatic-rename off

set -g display-panes-time 1500

# === Extended keys ===
# Lets tmux decode CSI u sequences (CSI 9;5u / 9;6u) into keys such as C-Tab / C-S-Tab, which
# keys/ide.tmux binds to window cycling. The terminal has to send them: iTerm2 eats Ctrl+Tab by
# default (Next/Previous Tab); remove those shortcuts under Settings > Keys > Key Bindings, then
# either rely on CSI u reporting ("Apps can change how keys are reported") or add profile key
# mappings sending the sequences explicitly:
#   Ctrl+Tab       -> Send Escape Sequence: [9;5u
#   Ctrl+Shift+Tab -> Send Escape Sequence: [9;6u
set -s extended-keys on
